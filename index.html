<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI軟絲導航 Lite</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
}

#map{
    width:100%;
    height:45vh;
}

.panel{
    padding:12px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    color:white;
    background:#2563eb;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    border-radius:8px;
    border:none;
}

.arrow{
    font-size:28px;
    display:inline-block;
}

.grid{
    display:grid;
    gap:10px;
}

canvas{
    background:white;
    border-radius:8px;
}

@media(min-width:768px){

    .grid{
        grid-template-columns:
        repeat(2,1fr);
    }

    button{
        width:auto;
    }

}

</style>

</head>

<body>

<div id="map"></div>

<div class="panel">
